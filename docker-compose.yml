version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: jobscraper-db
    environment:
      POSTGRES_DB: jobscraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobscraper-backend
    ports:
      - "3001:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/jobscraper
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - scrape-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: jobscraper-frontend
    ports:
      - "3003:3000"
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  scrape-data:
